name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php-tests:
    name: PHPUnit (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10']
        include:
          - php: '8.2'
            laravel: '9'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin to Laravel 9
        if: matrix.laravel == '9'
        run: composer require "laravel/framework:^9.0" "orchestra/testbench:^7.0" --no-update

      - name: Install dependencies
        if: matrix.laravel != '9'
        run: composer install --prefer-dist --no-progress

      - name: Install dependencies (Laravel 9 pinned)
        if: matrix.laravel == '9'
        run: composer update --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  php-static-analysis:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run static analysis
        run: composer analyse

  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: ./vendor/bin/pint --test
